namespace: liquid
name: d1-3b
title: d1-3B
description: Liquid AI's open 3B decision model for text and images. Send a state and up to 8 images with typed questions (choice, score, yes/no); get a probability for every answer in one pass, no generation.
metadata:
    tags:
        - classification
        - routing
        - moderation
        - vision
        - open-weights
category: decision
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/z4qlobm9.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/jt6vmciu.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/6wji6mag.png
env: {}
credentials:
    - provider: huggingface
      secrets: [HF_TOKEN]
      description: Faster, rate-limit-free weight downloads. The weights are public.
      optional: true
kernel: python-3.11
resources:
    gpu:
        count: 1
        vram: 16
        type: any
    ram: 16
