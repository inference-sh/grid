namespace: vllm-sr
name: d3-lite
title: Decision 3.0 d3-lite 0.8B
description: "The 0.8B Decision 3.0 model from vLLM Semantic Router. Send text, images and videos with typed questions (choice, score, yes/no); get a probability for every answer."
metadata:
    tags:
        - classification
        - routing
        - moderation
        - vision
        - video
        - open-weights
category: decision
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/u3pxrmhh.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/z795h543.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/ysg1fyr3.png
env: {}
credentials:
    - provider: huggingface
      secrets: [HF_TOKEN]
      description: Faster, rate-limit-free weight downloads. The weights are public.
      optional: true
kernel: python-3.11
resources:
    gpu:
        count: 1
        vram: 12
        type: any
    ram: 16
