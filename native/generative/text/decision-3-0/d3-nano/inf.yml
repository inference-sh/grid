namespace: vllm-sr
name: d3-nano
title: Decision 3.0 d3-nano 2B
description: "The 2B Decision 3.0 model from vLLM Semantic Router. Send text, images and videos with typed questions (choice, score, yes/no); get a probability for every answer."
metadata:
    tags:
        - classification
        - routing
        - moderation
        - vision
        - video
        - open-weights
category: decision
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/g1v0b8f5.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/x0rqf8uu.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/6ocuj2kr.png
env: {}
credentials:
    - provider: huggingface
      secrets: [HF_TOKEN]
      description: Faster, rate-limit-free weight downloads. The weights are public.
      optional: true
kernel: python-3.11
resources:
    gpu:
        count: 1
        vram: 16
        type: any
    ram: 24
