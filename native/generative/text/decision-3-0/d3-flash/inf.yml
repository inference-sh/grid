namespace: vllm-sr
name: d3-flash
title: Decision 3.0 d3-flash 9B
description: "The 9B Decision 3.0 model from vLLM Semantic Router. Send text, images and videos with typed questions (choice, score, yes/no); get a probability for every answer."
metadata:
    tags:
        - classification
        - routing
        - moderation
        - vision
        - video
        - open-weights
category: decision
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/qxeqk8q7.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/eo2yq3tw.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/8g8flfla.png
env: {}
credentials:
    - provider: huggingface
      secrets: [HF_TOKEN]
      description: Faster, rate-limit-free weight downloads. The weights are public.
      optional: true
kernel: python-3.11
resources:
    gpu:
        count: 1
        vram: 40
        type: any
    ram: 48
