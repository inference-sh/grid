namespace: vllm-sr
name: d3
title: Decision 3.0 d3 27B
description: "The largest Decision 3.0 model from vLLM Semantic Router. Send text, images and videos with typed questions (choice, score, yes/no); get a probability for every answer."
metadata:
    tags:
        - classification
        - routing
        - moderation
        - vision
        - video
        - open-weights
category: decision
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/st6i55u7.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/ev2j2asb.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/2zqdalcx.png
env: {}
credentials:
    - provider: huggingface
      secrets: [HF_TOKEN]
      description: Faster, rate-limit-free weight downloads. The weights are public.
      optional: true
kernel: python-3.11
resources:
    gpu:
        count: 1
        vram: 80
        type: any
    ram: 96
