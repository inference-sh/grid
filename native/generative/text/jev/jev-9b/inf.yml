namespace: autotrust
name: jev-9b
title: JEV-9B
description: AutoTrust's small open decision model with vision. Send text and up to 8 images with typed questions (choice, score, yes/no); get a calibrated probability for every answer.
metadata:
    tags:
        - classification
        - routing
        - moderation
        - vision
        - open-weights
category: decision
images:
    card: ""
    thumbnail: ""
    banner: ""
env: {}
credentials:
    - provider: huggingface
      secrets: [HF_TOKEN]
      description: Faster, rate-limit-free weight downloads. The weights are public.
      optional: true
kernel: python-3.11
resources:
    gpu:
        count: 1
        vram: 48
        type: any
    ram: 48
