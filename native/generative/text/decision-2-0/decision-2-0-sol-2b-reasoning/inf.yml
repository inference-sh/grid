namespace: vllm-sr
name: decision-2-0-sol-2b-reasoning
title: Decision 2.0 Sol 2B Reasoning
description: The reasoning variant of Decision 2.0 Sol 2B, stronger on multi-step problems (arithmetic, code execution, causal and logical questions) at the same speed from vLLM Semantic Router. Send a state and typed questions (choice, score, yes/no); get a probability for every answer in one forward pass, with no text generation. 1.88B parameters, 16,384-token input, about 7.5 ms per question.
metadata:
    tags:
        - classification
        - routing
        - moderation
        - open-weights
category: decision
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/qlxdxaix.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/8rn52kmr.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/2joqon1f.png
env: {}
credentials:
    - provider: huggingface
      secrets: [HF_TOKEN]
      description: Faster, rate-limit-free weight downloads. The weights are public.
      optional: true
kernel: python-3.11
resources:
    gpu:
        count: 1
        vram: 12
        type: any
    ram: 16
