namespace: vllm-sr
name: decision-2-0-sol-2b
title: Decision 2.0 Sol 2B
description: The 2B Decision 2.0 model from vLLM Semantic Router. Send a state and typed questions (choice, score, yes/no); get a probability for every answer in one forward pass, with no text generation. 1.88B parameters, 16,384-token input, about 7.2 ms per question.
metadata:
    tags:
        - classification
        - routing
        - moderation
        - open-weights
category: decision
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/la4nr62l.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/gp3nn8hd.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/2ujhcizl.png
env: {}
credentials:
    - provider: huggingface
      secrets: [HF_TOKEN]
      description: Faster, rate-limit-free weight downloads. The weights are public.
      optional: true
kernel: python-3.11
resources:
    gpu:
        count: 1
        vram: 12
        type: any
    ram: 16
