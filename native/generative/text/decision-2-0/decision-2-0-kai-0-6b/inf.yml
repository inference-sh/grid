namespace: vllm-sr
name: decision-2-0-kai-0-6b
title: Decision 2.0 Kai 0.6B
description: The smallest and fastest Decision 2.0 model from vLLM Semantic Router. Send a state and typed questions (choice, score, yes/no); get a probability for every answer in one forward pass, with no text generation. 0.60B parameters, 8,192-token input, about 4.9 ms per question.
metadata:
    tags:
        - classification
        - routing
        - moderation
        - open-weights
category: decision
images:
    card: https://cloud.inference.sh/app/files/t/71ckmsn3/q0df177r.png
    thumbnail: https://cloud.inference.sh/app/files/t/71ckmsn3/4zsvl5tu.png
    banner: https://cloud.inference.sh/app/files/t/71ckmsn3/ww8uj7li.png
env: {}
credentials:
    - provider: huggingface
      secrets: [HF_TOKEN]
      description: Faster, rate-limit-free weight downloads. The weights are public.
      optional: true
kernel: python-3.11
resources:
    gpu:
        count: 1
        vram: 8
        type: any
    ram: 8
