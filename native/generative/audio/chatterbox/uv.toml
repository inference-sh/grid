# chatterbox-tts pins exact versions that hold the app back; these replace them.
# gradio is only chatterbox's demo UI (gradio caps pillow below 13).
override-dependencies = [
    "gradio ; sys_platform == 'never'",
    "torch==2.14.1",
    "torchaudio==2.11.1",
    "transformers==5.22.1",
    "safetensors==0.8.0",
    "diffusers>=0.42.1",
    # chatterbox-tts caps numpy below 2 on Python < 3.13 only; its 3.13 range is numpy 2
    "numpy>=2.5.3,<2.6",
]
