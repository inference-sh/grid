namespace: infsh
name: gemma-3-12b-it
description: Developed by Google, this open-source tool processes both text and images to answer questions, summarize content, perform reasoning tasks, and understand images.
metadata:
    capabilities:
        - image
category: chat
functions:
    - name: run
      description: Chat completion (inference.sh LLMInput/LLMOutput)
    - name: openai
      description: OpenAI Chat Completions compatible entry point
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/wvuqzjfr.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/e433yqvv.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/ris86yuq.png
env:
    CMAKE_ARGS: -DGGML_CUDA=on
kernel: python-3.11
resources:
    gpu:
        count: 1
        vram: 18000000000
        type: any
    ram: 4000000000
