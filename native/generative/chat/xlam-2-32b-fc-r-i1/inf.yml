namespace: infsh
name: xlam-2-32b-fc-r-i1
description: A system capable of advanced multi-step reasoning and a strong understanding of language and context to create actionable plans.
metadata:
    capabilities:
        - tools
category: chat
functions:
    - name: run
      description: Chat completion (inference.sh LLMInput/LLMOutput)
    - name: openai
      description: OpenAI Chat Completions compatible entry point
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/ksqfjb9z.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/3e5xupcu.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/abkmfeav.png
env:
    CMAKE_ARGS: -DGGML_CUDA=on
    FORCE_CMAKE: "1"
kernel: python-3.11
resources:
    gpu:
        count: 1
        vram: 12000000000
        type: any
    ram: 4000000000
