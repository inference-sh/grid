name: lock-floors

on:
  pull_request:
    paths:
      - "**/requirements.txt"
      - "**/requirements.lock"
      - "**/requirements.txt.compiled"
      - "scripts/check-lock-floors.py"
      - "scripts/test_check_lock_floors.py"
      - "scripts/lock-floors-exceptions.txt"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install packaging
      - run: python scripts/test_check_lock_floors.py
      - run: python scripts/check-lock-floors.py
