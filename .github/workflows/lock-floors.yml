name: lock-floors

on:
  pull_request:
    paths:
      - "**/requirements.txt"
      - "**/requirements.lock"
      - "**/requirements.txt.compiled"
      - "scripts/check-lock-floors.py"
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install packaging
      - run: python scripts/check-lock-floors.py
