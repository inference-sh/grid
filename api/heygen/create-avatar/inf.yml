namespace: heygen
name: create-avatar
description: Create HeyGen avatars from video footage (digital twin), a photo (photo avatar), or a text prompt (AI-generated). Returns a look ID for use with avatar-video.
metadata:
    provider: heygen
    tags:
        - avatar
        - avatar-creation
        - digital-twin
        - photo-avatar
        - heygen
category: video
images:
    card: ""
    thumbnail: ""
    banner: ""
env: {}
kernel: python-3.11
secrets:
    - key: HEYGEN_KEY
      description: HeyGen API key from dashboard
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 0
