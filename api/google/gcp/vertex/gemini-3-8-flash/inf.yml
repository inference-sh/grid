namespace: google
name: gemini-3-8-flash
description: Gemini 3.8 Flash via Vertex AI — Google's most capable Flash model, built for long-horizon software engineering, autonomous agents and complex enterprise workflows. 1M token context window.
metadata:
    capabilities:
        - reasoning
        - image
category: chat
functions:
    - name: run
      description: Chat completion (inference.sh LLMInput/LLMOutput)
    - name: openai
      description: OpenAI Chat Completions compatible entry point
env: {}
kernel: python-3.11
credentials:
    - key: gcp.vertex_ai
      description: Access Vertex AI models (Gemini, etc.)
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 0
