namespace: tavily
name: search-assistant
description: Tavily-powered search assistant that browses the internet and returns comprehensive results. Searches the web using Tavily API with configurable depth, filters, and includes AI-generated answers, images, and detailed sources.
metadata:
    tags:
        - web-search
category: text
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/2e234epf.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/djpjx0da.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/labznvca.png
env:
    PYTHONPATH: /app
kernel: python-3.11
credentials:
    tavily:
        secrets: [TVLY_API_KEY]
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4000000000
title: Tavily Search Assistant
