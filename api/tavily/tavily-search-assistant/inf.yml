namespace: tavily
name: search-assistant
description: Tavily-powered search assistant that browses the internet and returns comprehensive results. Searches the web using Tavily API with configurable depth, filters, and includes AI-generated answers, images, and detailed sources.
metadata: {}
category: text
images:
    card: https://cloud.inference.sh/app/files/u/4mg21r6ta37mpaz6ktzwtt8krr/01kgndqmn1zjmsv6sqq68wz8ck.jpeg
    thumbnail: https://cloud.inference.sh/app/files/u/4mg21r6ta37mpaz6ktzwtt8krr/01kgndqqj6t8b4ts36kh130syj.jpeg
    banner: https://cloud.inference.sh/app/files/u/4mg21r6ta37mpaz6ktzwtt8krr/01kgndqjxd780zm2j3rmada6y8.jpeg
env:
    PYTHONPATH: /app
kernel: python-3.10
secrets:
    - key: TVLY_API_KEY
      description: Tavily API key for model access
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4000000000
