namespace: runway
name: gen-4-image-turbo
description: Runway Gen-4 Image Turbo — fast text-to-image generation with reference image support. 2 credits per image at any resolution.
metadata:
    provider: runway
    tags:
        - runway
        - image-generation
        - text-to-image
        - gen4
        - turbo
category: image
kernel: python-3.11
secrets:
    - key: RUNWAY_KEY
      description: Runway API secret key from dev.runwayml.com
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4
