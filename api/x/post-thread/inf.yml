namespace: x
name: post-thread
description: Create threaded posts on X.com. Provide 2-25 tweets that are posted sequentially as a reply chain. Each tweet supports text (280 char limit) and optional media (up to 4 images or 1 video/GIF). Images over 5MB are auto-resized.
metadata: {}
category: social
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/rqbke434.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/tvo74nv2.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/6w6519xr.png
env: {}
kernel: python-3.11
integrations:
    - key: x.tweet.write
      description: Create threaded posts with text and media on X.com
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 2000000000
