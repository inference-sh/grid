namespace: mirage
name: ai-twin
description: Create a reusable AI Twin avatar from a calibration video and stills, usable as a creator in mirage/ai-creator and mirage/ai-ads.
metadata:
    provider: mirage
    tags:
        - avatar-creation
        - ai-twin
        - training
        - likeness
        - voice-clone
        - captions
category: other
env: {}
kernel: python-3.11
secrets:
    - key: CAPTIONS_KEY
      description: Mirage/Captions API key from platform.mirage.app
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4
