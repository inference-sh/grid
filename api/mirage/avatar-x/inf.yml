namespace: mirage
name: avatar-x
description: Generate an expressive talking-head video from a portrait image or video reference and an audio track using Mirage Avatar X, with natural lip sync, eye contact and micro-expressions.
metadata:
    provider: mirage
    tags:
        - talking-head
        - avatar
        - lipsync
        - video-generation
        - mirage
        - avatar-x
category: video
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/coji0579.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/13iplrpu.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/ncrkx5us.png
env: {}
kernel: python-3.11
secrets:
    - key: CAPTIONS_KEY
      description: Mirage/Captions API key from platform.mirage.app
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4000000000
