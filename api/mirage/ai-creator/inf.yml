namespace: mirage
name: ai-creator
description: Turn a script into a spokesperson video performed by a Captions AI Creator or your own AI Twin, up to 4K.
metadata:
    provider: mirage
    tags:
        - avatar
        - talking-head
        - text-to-video
        - spokesperson
        - ugc
        - captions
category: video
env: {}
kernel: python-3.11
secrets:
    - key: CAPTIONS_KEY
      description: Mirage/Captions API key from platform.mirage.app
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4
