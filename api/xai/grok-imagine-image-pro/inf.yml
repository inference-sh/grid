namespace: xai
name: grok-imagine-image-pro
description: Generate and edit images using xAI's Grok Imagine Pro model. Supports text-to-image and image editing with multiple aspect ratios.
metadata:
    provider: xai
    tags:
        - grok
        - image-generation
        - text-to-image
        - image-editing
        - xai
category: image
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/0dptpu5k.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/h0zydca1.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/fyocdo0k.png
env: {}
kernel: python-3.11
secrets:
    - key: XAI_API_KEY
      description: xAI API key for Grok Imagine Pro access
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4000000000
