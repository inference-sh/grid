    thumbnail: https://cloud.inference.sh/app/files/t/71ckmsn3/he8th6uw.png
    banner: https://cloud.inference.sh/app/files/t/71ckmsn3/ppubecl2.png
env: {}
kernel: python-3.11
secrets:
    - key: XAI_API_KEY
      description: xAI API key for Speech to Text access
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 1000000000
