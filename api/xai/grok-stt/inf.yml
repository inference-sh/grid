namespace: xai
name: grok-stt
title: Grok Speech to Text
description: Transcribe speech with xAI's Grok Speech to Text. Send a recording and get the transcript with word timings and speakers, or stream a microphone over a socket and read the transcript as it is spoken.
metadata:
    provider: xai
    tags:
        - grok
        - speech-to-text
        - stt
        - transcription
        - realtime
        - audio
        - xai
category: audio
images:
