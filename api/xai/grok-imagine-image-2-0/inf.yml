namespace: xai
name: grok-imagine-image-2-0
description: Generate and edit images with xAI's Grok Imagine Image 2.0. Text-to-image or editing with up to 5 source images, low or medium quality, 1K or 2K output.
metadata:
    provider: xai
    tags:
        - text-to-image
        - image-to-image
        - image-editing
category: image
images:
    card: https://cloud.inference.sh/app/files/t/71ckmsn3/9fy2ztt2.png
    thumbnail: https://cloud.inference.sh/app/files/t/71ckmsn3/yzwkjaxd.png
    banner: https://cloud.inference.sh/app/files/t/71ckmsn3/etfr4o87.png
env: {}
kernel: python-3.11
secrets:
    - key: XAI_API_KEY
      description: xAI API key for Grok Imagine access
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4000000000
