namespace: xai
name: grok-4-7
description: Grok 4.7 — xAI's most capable model for chat, code and agents. 500k context, reasoning effort low to xhigh, image input and tool use via the xAI Responses API. Direct API.
metadata:
    capabilities:
        - reasoning
        - image
    provider: xai
    tags:
        - xai
        - grok
        - grok-4.7
        - llm
        - reasoning
category: chat
functions:
    - name: run
      description: Chat completion (inference.sh LLMInput/LLMOutput)
    - name: openai
      description: OpenAI Chat Completions compatible entry point
env: {}
kernel: python-3.11
secrets:
    - key: XAI_API_KEY
      description: xAI API key
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 0
