namespace: aikido
name: workspace
title: Aikido Workspace
description: "Aikido workspace: workspace info, configuration errors, SLA settings and wallet balance."
metadata:
    tags:
        - security
        - workspace
category: other
images:
    card: ""
    thumbnail: ""
    banner: ""
env: {}
kernel: python-3.11
default_function: get_workspace_info
credentials:
    aikido:
        scopes: ['basics:read']
        provider:
            name: Aikido
            website: aikido.dev
        auth:
            kind: oauth2
            flow: client_credentials
            token_endpoint: https://app.aikido.dev/api/oauth/token
            scopes: ['autofix:read', 'autofix:write', 'basics:read', 'broker:read', 'broker:write', 'bug_bounty:read', 'bug_bounty:write', 'clouds:read', 'clouds:write', 'code_coverage:read', 'code_quality:read', 'code_quality:write', 'containers:read', 'containers:write', 'custom_sast_rules:read', 'custom_sast_rules:write', 'domains:read', 'domains:write', 'endpoint_protection:read', 'firewall:read', 'firewall:write', 'issues:read', 'issues:write', 'license:write', 'licenses:write', 'pentests:read', 'pentests:write', 'reports:read', 'repositories:read', 'repositories:write', 'request_inbox:read', 'request_inbox:write', 'research:read', 'task_tracking:read', 'task_tracking:write', 'teams:read', 'teams:write', 'users:read', 'users:write', 'virtual_machines:read', 'webhooks:read', 'webhooks:write']
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 0
