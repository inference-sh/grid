namespace: anthropic
name: claude-code-fable-5-1
title: Claude Fable 5.1 (Claude Code)
description: "Claude Fable 5.1 through Claude Code on your own Claude Pro/Max plan. Connect your `claude setup-token` token; usage counts against your Claude plan, not inference.sh."
metadata:
    capabilities:
        - reasoning
        - image
    tags:
        - claude-code
        - subscription
        - reasoning
        - coding
category: chat
functions:
    - name: run
      description: Chat completion (inference.sh LLMInput/LLMOutput)
    - name: openai
      description: OpenAI Chat Completions compatible entry point
images:
    card: ""
    thumbnail: ""
    banner: ""
env: {}
kernel: python-3.11
credentials:
    claude-code:
        secrets: [CLAUDE_CODE_OAUTH_TOKEN]
        company: {slug: anthropic}
        display_name: Claude Code
        connection_scope: user
        expires_after_days: 365
        docs_url: https://inference.sh/docs/integrations/claude-code-subscription
        instructions: |
            Use your own Claude Pro or Max plan as a model.

            1. Install Claude Code and log in with your Claude account.
            2. Run `claude setup-token` and copy the token it prints. It starts with `sk-ant-oat01-` and lasts a year.
            3. Paste it here.

            The token is used only for your own runs, never shared with your workspace. [How it works](https://inference.sh/docs/integrations/claude-code-subscription)
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 0
