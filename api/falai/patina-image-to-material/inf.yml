namespace: falai
name: patina-image-to-material
description: Predicts seamless high-resolution PBR material maps (basecolor, normal, roughness, metalness, height) from a single input image via fal.ai PATINA.
metadata:
    provider: fal-ai
    tags:
        - patina
        - pbr
        - material
        - normal
        - roughness
        - basecolor
        - albedo
        - height
        - metalness
        - image-to-image
category: image
images:
    card: https://cloud.inference.sh/app/files/t/71ckmsn3/wryckfnr.jpeg
    thumbnail: https://cloud.inference.sh/app/files/t/71ckmsn3/tyd35xh2.jpeg
    banner: https://cloud.inference.sh/app/files/t/71ckmsn3/3wlpq2jw.jpeg
env: {}
kernel: python-3.11
secrets:
    - key: FAL_KEY
      description: fal.ai API key for model access
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4000000000
