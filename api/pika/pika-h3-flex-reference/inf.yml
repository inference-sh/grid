namespace: pika
name: pika-h3-flex-reference
title: Pika H3 Flex Reference to Video
description: Pika H3 Flex reference-to-video with synchronized audio. Guide the video with up to 9 images, 3 videos and 3 audio clips cited as @Image1, @Video1, @Audio1. 3-15s, 480p to 4K.
metadata:
    provider: pika
    tags:
        - reference-to-video
        - image-to-video
        - video-to-video
        - native-audio
category: video
images:
    card: ""
    thumbnail: ""
    banner: ""
env: {}
kernel: python-3.11
credentials:
    pika:
        secrets: [PIKA_API_KEY]
        provider: {name: Pika, website: pika.art, docs_uri: https://dev.pika.art}
        display_name: Pika API key
        docs_url: https://dev.pika.art
        instructions: |
            1. Sign in or create an account at [dev.pika.art/login](https://dev.pika.art/login).
            2. Create a key at [dev.pika.art/keys](https://dev.pika.art/keys).
            3. Add prepaid funds at [dev.pika.art/billing](https://dev.pika.art/billing). There is no free tier; jobs fail with `insufficient_balance` until the organization has a balance.
            4. Paste the key into `PIKA_API_KEY`.
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 2000000000
