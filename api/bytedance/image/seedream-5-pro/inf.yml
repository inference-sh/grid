        - image-editing
        - bytedance
        - byteplus
        - 2k
category: image
env: {}
kernel: python-3.11
secrets:
    - key: ARK_API_KEY
      description: BytePlus ModelArk API key for Seedream image generation
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4000000000
