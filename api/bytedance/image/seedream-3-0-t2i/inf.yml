namespace: bytedance
name: seedream-3-0-t2i
description: Generate cinematic quality images from text prompts with accurate text rendering using ByteDance's Seedream 3.0 T2I model via BytePlus ARK API.
metadata:
    provider: bytedance
    tags:
        - seedream
        - image-generation
        - text-to-image
        - bytedance
        - byteplus
        - 2k
category: image
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/2l4pfw9g.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/ezvrgsvl.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/1xfjpy37.png
env: {}
kernel: python-3.11
secrets:
    - key: ARK_API_KEY
      description: BytePlus ModelArk API key for Seedream image generation
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4000000000
