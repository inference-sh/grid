namespace: melious
name: qwen3-6-27b
title: Qwen 3.6 27B
description: Qwen 3.6 27B — dense 27B vision-language model with 262K context and thinking mode. Strong coding and multimodal reasoning, Apache 2.0. Via the Melious API.
metadata:
    capabilities:
        - reasoning
        - image
    provider: melious
    tags:
        - vision
        - reasoning
        - coding
category: chat
functions:
