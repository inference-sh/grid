namespace: melious
name: minimax-m3
title: MiniMax M3
description: MiniMax M3 — 428B multimodal MoE with 1M context and image input for long-horizon agentic, coding and cowork tasks. Via the Melious API.
metadata:
    capabilities:
        - reasoning
        - image
    provider: melious
    tags:
        - vision
        - reasoning
        - coding
category: chat
functions:
    - name: run
      description: Chat completion (inference.sh LLMInput/LLMOutput)
    - name: openai
      description: OpenAI Chat Completions compatible entry point
images:
    card: https://cloud.inference.sh/app/files/t/71ckmsn3/s8dq8dyz.png
    thumbnail: https://cloud.inference.sh/app/files/t/71ckmsn3/mud5xzok.png
    banner: https://cloud.inference.sh/app/files/t/71ckmsn3/0tj4zmwu.png
env: {}
kernel: python-3.11
secrets:
    - key: MELIOUS_KEY
      description: Melious API key
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 0
