namespace: klingai
name: video-v4
description: Kling V4.0 video generation. Text-to-video and image-to-video with start and end frames, 3-30s billed per second, 720p or 1080p, native audio and automatic shot-splitting.
metadata:
    provider: klingai
    tags:
        - text-to-video
        - image-to-video
        - native-audio
category: video
images:
    card: https://cloud.inference.sh/app/files/t/71ckmsn3/7nkipgzt.png
    thumbnail: https://cloud.inference.sh/app/files/t/71ckmsn3/ehwnp7ic.png
    banner: https://cloud.inference.sh/app/files/t/71ckmsn3/n5lph7la.png
env: {}
kernel: python-3.11
secrets:
    - key: KLING_KEY
      description: Kling AI API key (V2)
      optional: true
    - key: KLING_ACCESS_KEY
      description: Kling AI API access key
      optional: true
    - key: KLING_SECRET_KEY
      description: Kling AI API secret key
      optional: true
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4000000000
title: Kling Video V4
