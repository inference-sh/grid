namespace: klingai
name: image-v2
description: Kling Image V2 (Kolors V2.0) - text-to-image with 2K resolution, multi-image reference, and restyle. Restyle output matches input resolution.
metadata:
    provider: klingai
    tags:
        - kling
        - kolors
        - image-generation
        - restyle
        - 2k
category: image
images:
    card: https://cloud.inference.sh/app/files/t/71ckmsn3/9pfr47o2.jpg
    thumbnail: https://cloud.inference.sh/app/files/t/71ckmsn3/tdh2qow7.jpg
    banner: https://cloud.inference.sh/app/files/t/71ckmsn3/sx1mshj4.jpg
env: {}
kernel: python-3.11
secrets:
    - key: KLING_ACCESS_KEY
      description: Kling AI API access key
    - key: KLING_SECRET_KEY
      description: Kling AI API secret key
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4000000000
