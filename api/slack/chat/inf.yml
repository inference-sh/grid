namespace: slack
name: chat
description: Post, edit and delete Slack messages, and list channels — outbound messaging for agents and monitors
metadata:
    tags:
        - messaging
category: other
images:
    card: https://cloud.inference.sh/app/files/t/71ckmsn3/6c51lzmi.png
    thumbnail: https://cloud.inference.sh/app/files/t/71ckmsn3/pdtptzny.png
    banner: https://cloud.inference.sh/app/files/t/71ckmsn3/vl4xxi56.png
env:
    SLACK_API_URL: https://slack.com/api
kernel: python-3.11
default_function: post_message
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 2
title: Slack Chat
secrets:
    - key: SLACK_BOT_TOKEN
      description: Your Slack bot's token (xoxb-...), with chat:write and channels:read. Add it as a workspace secret; it is used unless a Slack login below gives one
      optional: true
credentials:
    - slug: slack
      secrets: [SLACK_BOT_TOKEN]
      description: Or connect Slack and add our bot to your workspace; its bot token is used ahead of the secret above
      optional: true
