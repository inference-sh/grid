namespace: openrouter
name: minimax-m3
description: MiniMax-M3 is a frontier multimodal model with 1M context window. Supports text, image, and video inputs for coding, reasoning, and long-horizon agentic tasks.
metadata:
    capabilities:
        - reasoning
        - image
        - file
category: chat
functions:
    - name: run
      description: Chat completion (inference.sh LLMInput/LLMOutput)
    - name: openai
      description: OpenAI Chat Completions compatible entry point
images:
    card: https://cloud.inference.sh/app/files/t/71ckmsn3/bihyv7eg.png
    thumbnail: https://cloud.inference.sh/app/files/t/71ckmsn3/wh59qr6u.png
    banner: https://cloud.inference.sh/app/files/t/71ckmsn3/8t0ejdwo.png
env: {}
kernel: ""
secrets:
    - key: OPENROUTER_API_KEY
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 0
