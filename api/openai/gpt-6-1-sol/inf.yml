namespace: openai
name: gpt-6-1-sol
title: GPT-6.1 Sol
description: GPT-6.1 Sol — OpenAI's near-Astra flagship at a fraction of the cost. 1M context, 128k output, reasoning effort low to max, vision, file input and tool use via the Responses API. Direct API.
metadata:
    capabilities:
        - reasoning
        - image
        - file
    provider: openai
    tags:
        - vision
        - reasoning
category: chat
functions:
    - name: run
      description: Chat completion (inference.sh LLMInput/LLMOutput)
    - name: openai
      description: OpenAI Chat Completions compatible entry point
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/r2rgihd0.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/vz19cbf3.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/ijpwl1jy.png
env: {}
kernel: python-3.11
secrets:
    - key: OPENAI_KEY
      description: OpenAI API key
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 0
