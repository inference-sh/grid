namespace: openai
name: gpt-6-luna
title: GPT-6 Luna
description: GPT-6 Luna — OpenAI's most efficient model for focused, high-volume tasks. 1M context, 128k output, reasoning effort none to max, vision, file input and tool use via the Responses API. Direct API.
metadata:
    capabilities:
        - reasoning
        - image
        - file
    provider: openai
    tags:
        - vision
        - reasoning
category: chat
functions:
    - name: run
      description: Chat completion (inference.sh LLMInput/LLMOutput)
    - name: openai
      description: OpenAI Chat Completions compatible entry point
images:
    card: https://cloud.inference.sh/app/files/t/65hmp52a/16mluijb.png
    thumbnail: https://cloud.inference.sh/app/files/t/65hmp52a/b7h88f4y.png
    banner: https://cloud.inference.sh/app/files/t/65hmp52a/54llq2es.png
env: {}
kernel: python-3.11
secrets:
    - key: OPENAI_KEY
      description: OpenAI API key
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 0
