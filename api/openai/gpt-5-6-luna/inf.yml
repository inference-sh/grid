namespace: openai
name: gpt-5-6-luna
description: GPT-5.6 Luna — OpenAI's fast, low-cost GPT-5.6 model. 1M context, 128k output, reasoning effort none to max, vision, file input and tool use. Direct API.
metadata:
    capabilities:
        - reasoning
        - image
        - file
    provider: openai
    tags:
        - openai
        - gpt-5.6
        - llm
        - reasoning
category: chat
functions:
    - name: run
      description: Chat completion (inference.sh LLMInput/LLMOutput)
    - name: openai
      description: OpenAI Chat Completions compatible entry point
env: {}
kernel: python-3.11
secrets:
    - key: OPENAI_KEY
      description: OpenAI API key
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 0
