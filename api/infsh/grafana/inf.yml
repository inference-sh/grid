namespace: infsh
name: grafana
description: Grafana API — alerts, silences, annotations, datasources, and Loki log queries through the datasource proxy
metadata: {}
category: other
images:
    card: ""
    thumbnail: ""
    banner: ""
kernel: python-3.11
default_function: list_alerts
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 2
title: Grafana
# One credential, two values: a service-account token is only valid on the
# Grafana that issued it, so the URL and the token travel together and are
# never mismatched. Deploying this catalogues the provider and, for a team
# that already holds both keys as secrets, links them and connects it.
credentials:
    - provider: grafana
      name: Grafana
      website: grafana.com
      description: The Grafana this app talks to — its base URL and a service account token issued by it
      secrets:
          - GRAFANA_URL
          - GRAFANA_API_KEY
