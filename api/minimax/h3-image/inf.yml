namespace: minimax
name: h3-image
title: MiniMax H3 Image
description: MiniMax H3 Image. Text-to-image and editing with up to 16 reference images. 1K to 4K output, any aspect ratio from 1:3 to 3:1, up to 10 images per run, built-in prompt enhancement.
metadata:
    provider: minimax
    tags:
        - text-to-image
        - image-editing
category: image
images:
    card: ""
    thumbnail: ""
    banner: ""
env: {}
kernel: python-3.11
credentials:
    minimax:
        secrets: [MINIMAX_KEY]
resources:
    gpu:
        count: 0
        vram: 0
        type: none
    ram: 4000000000
